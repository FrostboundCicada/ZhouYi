<text x="600" y="900" text-anchor="middle" font-size="24" fill="#5c4b35" font-family="serif">另有《说卦传》《序卦传》《杂卦传》</text>
<text x="600" y="1005" text-anchor="middle" font-size="22" fill="#705c3e" font-family="serif">十翼合计：彖传二篇、象传二篇、系辞传二篇、文言传一篇、说卦传一篇、序卦传一篇、杂卦传一篇</text>
</svg>