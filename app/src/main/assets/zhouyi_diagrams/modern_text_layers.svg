<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1120" viewBox="0 0 1200 1120">
<rect width="1200" height="1120" fill="#f4ecd9"/><rect x="28" y="28" width="1144" height="1064" rx="18" fill="none" stroke="#765f3d" stroke-width="3"/>
<text x="600" y="105" text-anchor="middle" font-size="54" fill="#382d20" font-family="serif">《周易》经传层次示意图</text>
<text x="600" y="162" text-anchor="middle" font-size="26" fill="#5c4b35" font-family="serif">区分经文与传文，阅读时勿将注释层次混为一体</text>
<rect x="250" y="215" width="700" height="170" rx="16" fill="#e8d8b9" stroke="#8d7048" stroke-width="3"/>
<text x="600" y="275" text-anchor="middle" font-size="43" fill="#302719" font-family="serif">经</text>
<text x="600" y="330" text-anchor="middle" font-size="30" fill="#302719" font-family="serif">卦画、卦辞、爻辞</text>
<text x="600" y="365" text-anchor="middle" font-size="21" fill="#705c3e" font-family="serif">六十四卦的主体经文</text>
<path d="M600 385V440" stroke="#765f3d" stroke-width="4"/><path d="M590 428L600 442L610 428" fill="none" stroke="#765f3d" stroke-width="4"/>
<rect x="150" y="455" width="900" height="495" rx="16" fill="#eee2c9" stroke="#a18a64" stroke-width="3"/>
<text x="600" y="515" text-anchor="middle" font-size="43" fill="#302719" font-family="serif">传：十翼</text>
<g fill="#f8f0df" stroke="#b29b72" stroke-width="2">
<rect x="205" y="560" width="350" height="125" rx="12"/><rect x="645" y="560" width="350" height="125" rx="12"/>
<rect x="205" y="715" width="350" height="125" rx="12"/><rect x="645" y="715" width="350" height="125" rx="12"/>
</g>
<g text-anchor="middle" font-family="serif" fill="#302719">
<text x="380" y="610" font-size="31">《彖传》上下</text><text x="380" y="652" font-size="22">释卦辞、卦义</text>
<text x="820" y="610" font-size="31">《象传》上下</text><text x="820" y="652" font-size="22">大象释卦，小象释爻</text>
<text x="380" y="765" font-size="31">《系辞传》上下</text><text x="380" y="807" font-size="22">论易理与制作</text>
<text x="820" y="765" font-size="31">《文言传》</text><text x="820" y="807" font-size="22">专释乾、坤</text>
