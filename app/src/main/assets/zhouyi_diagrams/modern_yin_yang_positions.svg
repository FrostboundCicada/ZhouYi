<text x="600" y="1040" text-anchor="middle" font-size="21" fill="#705c3e" font-family="serif">校正提示：初、三、五为阳位；二、四、上为阴位。阳爻居阳位、阴爻居阴位，称为得位的一种常见判法</text>
