<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1120" viewBox="0 0 1200 1120">
<rect width="1200" height="1120" fill="#f4ecd9"/><rect x="28" y="28" width="1144" height="1064" rx="18" fill="none" stroke="#765f3d" stroke-width="3"/>
<text x="600" y="105" text-anchor="middle" font-size="54" fill="#382d20" font-family="serif">六爻爻位与阴阳位置</text>
<text x="600" y="162" text-anchor="middle" font-size="26" fill="#5c4b35" font-family="serif">爻位自下而上计数；奇数位为阳位，偶数位为阴位</text>
<g font-family="serif" text-anchor="middle" fill="#302719">
<text x="270" y="275" font-size="30">爻位</text><text x="600" y="275" font-size="30">对应位置属性</text><text x="930" y="275" font-size="30">爻画举例</text>
<g fill="#eee2c9" stroke="#a18a64" stroke-width="2">
<rect x="120" y="310" width="960" height="96" rx="10"/><rect x="120" y="420" width="960" height="96" rx="10"/><rect x="120" y="530" width="960" height="96" rx="10"/><rect x="120" y="640" width="960" height="96" rx="10"/><rect x="120" y="750" width="960" height="96" rx="10"/><rect x="120" y="860" width="960" height="96" rx="10"/>
</g>
<g font-size="34">
<text x="270" y="372">上爻（第六位）</text><text x="600" y="372">阴位</text><text x="930" y="372">阴爻 ━━　━━</text>
<text x="270" y="482">五爻（第五位）</text><text x="600" y="482">阳位</text><text x="930" y="482">阳爻 ━━━━━</text>
<text x="270" y="592">四爻（第四位）</text><text x="600" y="592">阴位</text><text x="930" y="592">阴爻 ━━　━━</text>
<text x="270" y="702">三爻（第三位）</text><text x="600" y="702">阳位</text><text x="930" y="702">阳爻 ━━━━━</text>
<text x="270" y="812">二爻（第二位）</text><text x="600" y="812">阴位</text><text x="930" y="812">阴爻 ━━　━━</text>
<text x="270" y="922">初爻（第一位）</text><text x="600" y="922">阳位</text><text x="930" y="922">阳爻 ━━━━━</text>
</g>
</g>
<text x="600" y="1015" text-anchor="middle" font-size="23" fill="#705c3e" font-family="serif">阳爻居阳位、阴爻居阴位，称为得位的一种常见判法；反之称失位</text>
<text x="600" y="1055" text-anchor="middle" font-size="20" fill="#705c3e" font-family="serif">此表列的是六个位置本身的阴阳属性，并非某一卦的实际爻象</text>
</svg>