<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1400" viewBox="0 0 1200 1400"><rect width="1200" height="1400" fill="#f4ecd9"/><rect x="28" y="28" width="1144" height="1344" rx="18" fill="none" stroke="#765f3d" stroke-width="3"/><text x="600" y="105" text-anchor="middle" font-size="54" fill="#382d20" font-family="serif">六爻卦体与爻位</text><text x="300" y="210" font-size="30" fill="#5c4b35" font-family="serif">一卦由六爻组成，读爻自下而上</text><g><g><path d="M510 350h300" stroke="#302719" stroke-width="18" stroke-linecap="square"/><text x="390" y="360" text-anchor="end" font-size="32" fill="#302719" font-family="serif">初爻</text><text x="860" y="360" font-size="30" fill="#302719" font-family="serif">初位</text></g><g><path d="M510 485h136 M674 485h136" stroke="#302719" stroke-width="18" stroke-linecap="square"/><text x="390" y="495" text-anchor="end" font-size="32" fill="#302719" font-family="serif">二爻</text><text x="860" y="495" font-size="30" fill="#302719" font-family="serif">二位</text></g><g><path d="M510 620h300" stroke="#302719" stroke-width="18" stroke-linecap="square"/><text x="390" y="630" text-anchor="end" font-size="32" fill="#302719" font-family="serif">三爻</text><text x="860" y="630" font-size="30" fill="#302719" font-family="serif">三位</text></g><g><path d="M510 755h136 M674 755h136" stroke="#302719" stroke-width="18" stroke-linecap="square"/><text x="390" y="765" text-anchor="end" font-size="32" fill="#302719" font-family="serif">四爻</text><text x="860" y="765" font-size="30" fill="#302719" font-family="serif">四位</text></g><g><path d="M510 890h300" stroke="#302719" stroke-width="18" stroke-linecap="square"/><text x="390" y="900" text-anchor="end" font-size="32" fill="#302719" font-family="serif">五爻</text><text x="860" y="900" font-size="30" fill="#302719" font-family="serif">五位</text></g><g><path d="M510 1025h136 M674 1025h136" stroke="#302719" stroke-width="18" stroke-linecap="square"/><text x="390" y="1035" text-anchor="end" font-size="32" fill="#302719" font-family="serif">上爻</text><text x="860" y="1035" font-size="30" fill="#302719" font-family="serif">上位</text></g></g><path d="M930 350v675" stroke="#9b8056" stroke-width="2"/><text x="600" y="1190" text-anchor="middle" font-size="28" fill="#302719" font-family="serif">下三爻为下卦｜上三爻为上卦</text><text x="600" y="1330" text-anchor="middle" font-size="24" fill="#705c3e" font-family="sans-serif">现代结构示意｜具体爻辞称谓须结合卦中阴阳属性，如初九、六二</text></svg>