<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1400" viewBox="0 0 1200 1400"><rect width="1200" height="1400" fill="#f4ecd9"/><rect x="28" y="28" width="1144" height="1344" rx="18" fill="none" stroke="#765f3d" stroke-width="3"/><text x="600" y="105" text-anchor="middle" font-size="54" fill="#382d20" font-family="serif">六次记录与六爻排列</text><text x="600" y="210" text-anchor="middle" font-size="30" fill="#5c4b35" font-family="serif">卦由六爻构成，记录顺序固定为初爻至上爻</text><rect x="180" y="295" width="840" height="95" rx="10" fill="#eee2c9"/><text x="290" y="358" font-size="32" fill="#302719" font-family="serif">上爻</text><text x="900" y="358" text-anchor="end" font-size="28" fill="#705c3e" font-family="serif">第六次</text><rect x="180" y="430" width="840" height="95" rx="10" fill="#eee2c9"/><text x="290" y="493" font-size="32" fill="#302719" font-family="serif">五爻</text><text x="900" y="493" text-anchor="end" font-size="28" fill="#705c3e" font-family="serif">第五次</text><rect x="180" y="565" width="840" height="95" rx="10" fill="#eee2c9"/><text x="290" y="628" font-size="32" fill="#302719" font-family="serif">四爻</text><text x="900" y="628" text-anchor="end" font-size="28" fill="#705c3e" font-family="serif">第四次</text><rect x="180" y="700" width="840" height="95" rx="10" fill="#eee2c9"/><text x="290" y="763" font-size="32" fill="#302719" font-family="serif">三爻</text><text x="900" y="763" text-anchor="end" font-size="28" fill="#705c3e" font-family="serif">第三次</text><rect x="180" y="835" width="840" height="95" rx="10" fill="#eee2c9"/><text x="290" y="898" font-size="32" fill="#302719" font-family="serif">二爻</text><text x="900" y="898" text-anchor="end" font-size="28" fill="#705c3e" font-family="serif">第二次</text><rect x="180" y="970" width="840" height="95" rx="10" fill="#eee2c9"/><text x="290" y="1033" font-size="32" fill="#302719" font-family="serif">初爻</text><text x="900" y="1033" text-anchor="end" font-size="28" fill="#705c3e" font-family="serif">第一次</text><path d="M1050 350v675" stroke="#9b8056" stroke-width="3"/><text x="600" y="1210" text-anchor="middle" font-size="28" fill="#302719" font-family="serif">先得初爻，逐次向上；第六次所得为上爻</text><text x="600" y="1330" text-anchor="middle" font-size="23" fill="#705c3e" font-family="sans-serif">现代操作示意｜第一次所得记初爻，依次向上</text></svg>