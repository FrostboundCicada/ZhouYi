<text x="600" y="295" font-size="44">上经：三十卦</text>
<text x="600" y="365" font-size="35">第一卦　乾</text><text x="600" y="425" font-size="35">……</text><text x="600" y="470" font-size="35">第三十卦　离</text>
<text x="600" y="605" font-size="44">下经：三十四卦</text>
