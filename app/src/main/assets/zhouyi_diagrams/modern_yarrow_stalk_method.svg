<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1700" viewBox="0 0 1200 1700">
<rect width="1200" height="1700" fill="#f4ecd9"/><rect x="28" y="28" width="1144" height="1644" rx="18" fill="none" stroke="#765f3d" stroke-width="3"/>
<text x="600" y="105" text-anchor="middle" font-size="54" fill="#382d20" font-family="serif">大衍蓍法步骤图</text>
<text x="600" y="165" text-anchor="middle" font-size="27" fill="#705c3e" font-family="serif">依朱熹《蓍卦考误》所述程序整理</text>
<rect x="110" y="185" width="980" height="125" rx="13" fill="#eee2c9" stroke="#a18a64" stroke-width="2"/><circle cx="180" cy="248" r="37" fill="#765f3d"/><text x="180" y="260" text-anchor="middle" font-size="28" fill="#fff8e8" font-family="serif">1</text><text x="250" y="238" font-size="33" fill="#302719" font-family="serif">备策</text><text x="250" y="284" font-size="23" fill="#5c4b35" font-family="serif">取五十策，先置一策不用，余四十九策参与推演。</text><path d="M600 312v35m-12 -12 12 12 12 -12" fill="none" stroke="#9b8056" stroke-width="4"/><rect x="110" y="350" width="980" height="125" rx="13" fill="#eee2c9" stroke="#a18a64" stroke-width="2"/><circle cx="180" cy="413" r="37" fill="#765f3d"/><text x="180" y="425" text-anchor="middle" font-size="28" fill="#fff8e8" font-family="serif">2</text><text x="250" y="403" font-size="33" fill="#302719" font-family="serif">分二</text><text x="250" y="449" font-size="23" fill="#5c4b35" font-family="serif">将四十九策分置左右两手，以象两仪。</text><path d="M600 477v35m-12 -12 12 12 12 -12" fill="none" stroke="#9b8056" stroke-width="4"/><rect x="110" y="515" width="980" height="125" rx="13" fill="#eee2c9" stroke="#a18a64" stroke-width="2"/><circle cx="180" cy="578" r="37" fill="#765f3d"/><text x="180" y="590" text-anchor="middle" font-size="28" fill="#fff8e8" font-family="serif">3</text><text x="250" y="568" font-size="33" fill="#302719" font-family="serif">挂一</text><text x="250" y="614" font-size="23" fill="#5c4b35" font-family="serif">从右手一组取一策，挂于左手小指之间。</text><path d="M600 642v35m-12 -12 12 12 12 -12" fill="none" stroke="#9b8056" stroke-width="4"/><rect x="110" y="680" width="980" height="125" rx="13" fill="#eee2c9" stroke="#a18a64" stroke-width="2"/><circle cx="180" cy="743" r="37" fill="#765f3d"/><text x="180" y="755" text-anchor="middle" font-size="28" fill="#fff8e8" font-family="serif">4</text><text x="250" y="733" font-size="33" fill="#302719" font-family="serif">揲四</text><text x="250" y="779" font-size="23" fill="#5c4b35" font-family="serif">先以四策为一组，数左手之策；再以四策为一组，数右手之策。</text><path d="M600 807v35m-12 -12 12 12 12 -12" fill="none" stroke="#9b8056" stroke-width="4"/><rect x="110" y="845" width="980" height="125" rx="13" fill="#eee2c9" stroke="#a18a64" stroke-width="2"/><circle cx="180" cy="908" r="37" fill="#765f3d"/><text x="180" y="920" text-anchor="middle" font-size="28" fill="#fff8e8" font-family="serif">5</text><text x="250" y="898" font-size="33" fill="#302719" font-family="serif">归奇</text><text x="250" y="944" font-size="23" fill="#5c4b35" font-family="serif">左右两组各自数余，分别归置指间，合为本变挂扐之数。</text><path d="M600 972v35m-12 -12 12 12 12 -12" fill="none" stroke="#9b8056" stroke-width="4"/><rect x="110" y="1010" width="980" height="125" rx="13" fill="#eee2c9" stroke="#a18a64" stroke-width="2"/><circle cx="180" cy="1073" r="37" fill="#765f3d"/><text x="180" y="1085" text-anchor="middle" font-size="28" fill="#fff8e8" font-family="serif">6</text><text x="250" y="1063" font-size="33" fill="#302719" font-family="serif">完成一变</text><text x="250" y="1109" font-size="23" fill="#5c4b35" font-family="serif">以上分二、挂一、揲四、归奇，合称一变。</text><path d="M600 1137v35m-12 -12 12 12 12 -12" fill="none" stroke="#9b8056" stroke-width="4"/><rect x="110" y="1175" width="980" height="125" rx="13" fill="#eee2c9" stroke="#a18a64" stroke-width="2"/><circle cx="180" cy="1238" r="37" fill="#765f3d"/><text x="180" y="1250" text-anchor="middle" font-size="28" fill="#fff8e8" font-family="serif">7</text><text x="250" y="1228" font-size="33" fill="#302719" font-family="serif">再变、三变</text><text x="250" y="1274" font-size="23" fill="#5c4b35" font-family="serif">收拢所余之策，重复上述程序；三变合定一爻。</text><path d="M600 1302v35m-12 -12 12 12 12 -12" fill="none" stroke="#9b8056" stroke-width="4"/><rect x="110" y="1340" width="980" height="125" rx="13" fill="#eee2c9" stroke="#a18a64" stroke-width="2"/><circle cx="180" cy="1403" r="37" fill="#765f3d"/><text x="180" y="1415" text-anchor="middle" font-size="28" fill="#fff8e8" font-family="serif">8</text><text x="250" y="1393" font-size="33" fill="#302719" font-family="serif">六爻成卦</text><text x="250" y="1439" font-size="23" fill="#5c4b35" font-family="serif">每爻三变，六爻共十八变，依次自初爻排至上爻。</text>
<rect x="110" y="1580" width="980" height="60" rx="10" fill="#e7d8bb"/><text x="600" y="1618" text-anchor="middle" font-size="22" fill="#705c3e" font-family="serif">说明：古籍对挂、扐及具体操作细节存在不同解释；本图仅呈现朱熹此篇所述一法。</text>
</svg>