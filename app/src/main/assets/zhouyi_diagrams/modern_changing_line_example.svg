<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1400" viewBox="0 0 1200 1400"><rect width="1200" height="1400" fill="#f4ecd9"/><rect x="28" y="28" width="1144" height="1344" rx="18" fill="none" stroke="#765f3d" stroke-width="3"/><text x="600" y="105" text-anchor="middle" font-size="54" fill="#382d20" font-family="serif">动爻与变卦示例</text><text x="600" y="205" text-anchor="middle" font-size="30" fill="#5c4b35" font-family="serif">示例：乾为天（䷀）初爻为老阳，变为阴</text><g><text x="330" y="315" text-anchor="middle" font-size="38" fill="#302719" font-family="serif">本卦：乾为天</text><path d="M230 390h200" stroke="#302719" stroke-width="18" stroke-linecap="square"/><path d="M230 485h200" stroke="#302719" stroke-width="18" stroke-linecap="square"/><path d="M230 580h200" stroke="#302719" stroke-width="18" stroke-linecap="square"/><path d="M230 675h200" stroke="#302719" stroke-width="18" stroke-linecap="square"/><path d="M230 770h200" stroke="#302719" stroke-width="18" stroke-linecap="square"/><path d="M230 865h200" stroke="#302719" stroke-width="18" stroke-linecap="square"/><text x="330" y="1010" text-anchor="middle" font-size="28" fill="#302719" font-family="serif">六爻皆阳</text><path d="M510 650h170m-25 -20l25 20l-25 20" fill="none" stroke="#9b3d25" stroke-width="8"/><text x="870" y="315" text-anchor="middle" font-size="38" fill="#302719" font-family="serif">之卦：天风姤</text><path d="M770 390h86 M884 390h86" stroke="#302719" stroke-width="18" stroke-linecap="square"/><path d="M770 485h200" stroke="#302719" stroke-width="18" stroke-linecap="square"/><path d="M770 580h200" stroke="#302719" stroke-width="18" stroke-linecap="square"/><path d="M770 675h200" stroke="#302719" stroke-width="18" stroke-linecap="square"/><path d="M770 770h200" stroke="#302719" stroke-width="18" stroke-linecap="square"/><path d="M770 865h200" stroke="#302719" stroke-width="18" stroke-linecap="square"/><text x="870" y="1010" text-anchor="middle" font-size="28" fill="#302719" font-family="serif">初爻由阳变阴</text></g><rect x="170" y="1090" width="860" height="110" rx="12" fill="#eee2c9"/><text x="600" y="1158" text-anchor="middle" font-size="28" fill="#302719" font-family="serif">变卦只改变动爻；其余五爻保持不变</text><text x="600" y="1330" text-anchor="middle" font-size="24" fill="#705c3e" font-family="sans-serif">现代结构示意｜乾初九变，得天风姤；不附会具体占断结论</text></svg>