<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1100" viewBox="0 0 1000 1100"><rect width="1000" height="1100" fill="#f4ecd9"/><rect x="24" y="24" width="952" height="1052" rx="8" fill="none" stroke="#765f3d" stroke-width="3"/><text x="500" y="95" text-anchor="middle" font-size="46" fill="#382d20" font-family="serif">河图天地生成数</text><g font-family="serif" text-anchor="middle"><text x="500" y="190" font-size="30" fill="#5c4b35">生数为天，成数为地；五行各有生成之合</text><g font-size="38" fill="#302719"><text x="180" y="330">水</text><text x="340" y="330">火</text><text x="500" y="330">木</text><text x="660" y="330">金</text><text x="820" y="330">土</text></g><g font-size="54" fill="#8b3028"><text x="180" y="445">1 / 6</text><text x="340" y="445">2 / 7</text><text x="500" y="445">3 / 8</text><text x="660" y="445">4 / 9</text><text x="820" y="445">5 / 10</text></g><g font-size="27" fill="#382d20"><text x="180" y="525">天一地六</text><text x="340" y="525">地二天七</text><text x="500" y="525">天三地八</text><text x="660" y="525">地四天九</text><text x="820" y="525">天五地十</text></g></g><text x="500" y="990" text-anchor="middle" font-size="22" fill="#705c3e" font-family="sans-serif">现代数表｜仅呈现天地生成数配对，不复原古图版式</text></svg>