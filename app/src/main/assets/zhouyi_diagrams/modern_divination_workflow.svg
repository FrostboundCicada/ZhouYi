<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1400" viewBox="0 0 1200 1400"><rect width="1200" height="1400" fill="#f4ecd9"/><rect x="28" y="28" width="1144" height="1344" rx="18" fill="none" stroke="#765f3d" stroke-width="3"/><text x="600" y="105" text-anchor="middle" font-size="54" fill="#382d20" font-family="serif">卜筮阅读流程</text><g font-family="serif" text-anchor="middle" fill="#302719"><rect x="85" y="210" width="470" height="150" rx="14" fill="#eee2c9" stroke="#a18a64" stroke-width="2"/><text x="320" y="275" font-size="34">一、明确所问</text><text x="320" y="325" font-size="24">问题具体、一次一事</text><rect x="645" y="210" width="470" height="150" rx="14" fill="#eee2c9" stroke="#a18a64" stroke-width="2"/><text x="880" y="275" font-size="34">二、采用起卦法</text><text x="880" y="325" font-size="24">说明蓍草法、三钱法或其他方法</text><rect x="85" y="455" width="470" height="150" rx="14" fill="#eee2c9" stroke="#a18a64" stroke-width="2"/><text x="320" y="520" font-size="34">三、记录六爻</text><text x="320" y="570" font-size="24">自下而上记录阴阳与动静</text><rect x="645" y="455" width="470" height="150" rx="14" fill="#eee2c9" stroke="#a18a64" stroke-width="2"/><text x="880" y="520" font-size="34">四、确定本卦</text><text x="880" y="570" font-size="24">下三爻为下卦，上三爻为上卦</text><rect x="85" y="700" width="470" height="150" rx="14" fill="#eee2c9" stroke="#a18a64" stroke-width="2"/><text x="320" y="765" font-size="34">五、标出动爻</text><text x="320" y="815" font-size="24">老阴、老阳标记为变爻</text><rect x="645" y="700" width="470" height="150" rx="14" fill="#eee2c9" stroke="#a18a64" stroke-width="2"/><text x="880" y="765" font-size="34">六、排出之卦</text><text x="880" y="815" font-size="24">只将动爻阴阳互换</text><rect x="85" y="945" width="470" height="150" rx="14" fill="#eee2c9" stroke="#a18a64" stroke-width="2"/><text x="320" y="1010" font-size="34">七、查阅文本</text><text x="320" y="1060" font-size="24">核对卦辞、爻辞及《易传》</text><rect x="645" y="945" width="470" height="150" rx="14" fill="#eee2c9" stroke="#a18a64" stroke-width="2"/><text x="880" y="1010" font-size="34">八、解释与复核</text><text x="880" y="1060" font-size="24">区分经文、注家解释和个人判断</text></g><text x="600" y="1330" text-anchor="middle" font-size="24" fill="#705c3e" font-family="sans-serif">现代学习辅助图｜流程为整理性说明，不替代各家筮法原文及注释</text></svg>