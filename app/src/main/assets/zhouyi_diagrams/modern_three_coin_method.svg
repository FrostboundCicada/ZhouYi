<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1400" viewBox="0 0 1200 1400"><rect width="1200" height="1400" fill="#f4ecd9"/><rect x="28" y="28" width="1144" height="1344" rx="18" fill="none" stroke="#765f3d" stroke-width="3"/><text x="600" y="105" text-anchor="middle" font-size="54" fill="#382d20" font-family="serif">三钱法：爻值与动静</text><text x="600" y="205" text-anchor="middle" font-size="30" fill="#5c4b35" font-family="serif">三枚钱币法：每次掷出记一爻，连续六次成卦</text><rect x="140" y="235" width="920" height="175" rx="12" fill="#eee2c9" stroke="#a18a64" stroke-width="2"/><text x="220" y="330" font-size="46" fill="#302719" font-family="serif">6</text><text x="360" y="330" font-size="36" fill="#302719" font-family="serif">老阴</text><path d="M590 315h71 M689 315h71" stroke="#302719" stroke-width="18" stroke-linecap="square"/><text x="830" y="330" font-size="28" fill="#302719" font-family="serif">动爻：变阳</text><rect x="140" y="455" width="920" height="175" rx="12" fill="#eee2c9" stroke="#a18a64" stroke-width="2"/><text x="220" y="550" font-size="46" fill="#302719" font-family="serif">7</text><text x="360" y="550" font-size="36" fill="#302719" font-family="serif">少阳</text><path d="M590 535h170" stroke="#302719" stroke-width="18" stroke-linecap="square"/><text x="830" y="550" font-size="28" fill="#302719" font-family="serif">静爻</text><rect x="140" y="675" width="920" height="175" rx="12" fill="#eee2c9" stroke="#a18a64" stroke-width="2"/><text x="220" y="770" font-size="46" fill="#302719" font-family="serif">8</text><text x="360" y="770" font-size="36" fill="#302719" font-family="serif">少阴</text><path d="M590 755h71 M689 755h71" stroke="#302719" stroke-width="18" stroke-linecap="square"/><text x="830" y="770" font-size="28" fill="#302719" font-family="serif">静爻</text><rect x="140" y="895" width="920" height="175" rx="12" fill="#eee2c9" stroke="#a18a64" stroke-width="2"/><text x="220" y="990" font-size="46" fill="#302719" font-family="serif">9</text><text x="360" y="990" font-size="36" fill="#302719" font-family="serif">老阳</text><path d="M590 975h170" stroke="#302719" stroke-width="18" stroke-linecap="square"/><text x="830" y="990" font-size="28" fill="#302719" font-family="serif">动爻：变阴</text><text x="600" y="1230" text-anchor="middle" font-size="26" fill="#302719" font-family="serif">老阴、老阳为动爻；少阴、少阳为静爻</text><text x="600" y="1330" text-anchor="middle" font-size="24" fill="#705c3e" font-family="sans-serif">现代方法示意｜此图只列常见记值规则；钱币正反面如何计数须先统一约定</text></svg>